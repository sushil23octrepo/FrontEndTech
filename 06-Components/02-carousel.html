<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #343a40;
        }

        img {
            height: 200px;
            border-radius: 8px;
            transform: scale(1.5);
            box-shadow: 0 12px 24px rgba(0, 0, 0, .25);
        }

        .caraousel {
            background-color: #087f5b;
            width: 800px;
            margin: 100px auto;
            border-radius: 8px;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 86px;
            padding-left: 86px;
            position: relative;
        }

        .testimonial-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 24px;
            color: #e6fcf5;
        }

        .testimonial-author {
            font-size: 14px;
            margin-bottom: 4px;
            color: #c3fae8;
        }

        .testimonal-job {
            font-size: 12px;
            color: #c3fae8;
        }

        .btn {
            height: 40px;
            width: 40px;
            background-color: #fff;
            border: none;
            position: absolute;
            border-radius: 50%;
            top: 50%;
            box-shadow: 0 12px 24px rgba(0, 0, 0, .25);
            cursor: pointer;
        }

        .btn-icon {
            height: 24px;
            width: 24px;
            stroke: #087f5b;
        }


        .btn--left {
            left: 0;
            transform: translate(-50%, -50%);

        }

        .btn--right {
            right: 0;
            transform: translate(50%, -50%);

        }

        .dots {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translate(-50%, 32px);
            display: flex;
            gap: 12px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #fff;
            border: 2px solid #087f5b;
            border-radius: 50px;
            cursor: pointer;
        }

        .dot--fill {
            background-color: #087f5b;
        }
    </style>
</head>

<body>
    <div class="caraousel">
        <img src="maria.jpg" alt="picture of maria">
        <blockquote class="testimonal">
            <p class="testimonial-text">
                "Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum itaque, reiciendis, maiores ea
                provident eum corporis accusamus ut aperiam, vel autem quaerat. Quos at repudiandae voluptate
                perferendis, nulla ab hic!"
            </p>
            <p class="testimonial-author">
                Maria De Almeida
            </p>
            <p class="testimonal-job">
                Product Manager at EDP comercial
            </p>
        </blockquote>
        <button class="btn btn--left">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </button>
        <button class="btn btn--right">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="btn-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
        </button>

        <div class="dots">
            <button class="dot dot--fill">&nbsp;</button>
            <button class="dot">&nbsp;</button>
            <button class="dot">&nbsp;</button>
            <button class="dot">&nbsp;</button>
        </div>
    </div>
</body>

</html>
