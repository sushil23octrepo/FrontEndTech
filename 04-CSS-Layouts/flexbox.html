<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox</title>
  <style>
    .el--1 {
      background-color: blueviolet;
    }

    .el--2 {
      background-color: orangered;
    }

    .el--3 {
      background-color: green;
      height: 150px;
    }

    .el--4 {
      background-color: goldenrod;
    }

    .el--5 {
      background-color: palevioletred;
    }

    .el--6 {
      background-color: steelblue;
    }

    .el--7 {
      background-color: yellow;
    }

    .el--8 {
      background-color: crimson;
    }

    .el--1 {
      align-self: flex-start;
      flex-grow: 1;
    }

    .el--5 {
      align-self: stretch;
      order: 1;
    }

    .el--6 {
      /*
      order of all flex items is by default zero,so we can change order based on our requirement
      here we want to show el--6 item at the first under flex container. 
      */
      order: -1;
    }

    .el {
      /* 
      Default values:
       flex-grow: 0;
      flex-shrink: 1;
      flex-basis: auto;
       */

      /*1. flex-basis is used to provide width for the element but if element content is less than
       100px, the size will grow to fit but it more than 150px then it will be fix to 150px. this happened
       because flex-shring is by default 1, if we want to strict with exact flex-basis size we need to make 
       flex shrik 0 
       2. if we set flex-grow:1 it will evenly divide width to all flex items. if we set flex-grow:1 to sepecific
       flex item then only that particular item will be allow to fill remaining spaces.
       Note: if we specify flex-grow:1 to container and then give flexi-grow:2 to specific flex item then that item
       will grow double to others. intead of flex-grow:1 we can simply used flex:1
       flex shorthand property contains following field=> flex:flex-grow flex-shrink flex-basis
       */
      flex-basis: 150px;
      flex-shrink: 0;
    }

    .container {
      /* STARTER */
      font-family: sans-serif;
      background-color: #ddd;
      font-size: 34px;
      margin: 40px;
      display: flex;
      /* Align item vertically center */
      align-items: center;

      /* Align item horizontly   */
      justify-content: flex-start;
      /* gap: 30px; */

      /* FLEXBOX */
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="el el--1">HTML</div>
    <div class="el el--2">and</div>
    <div class="el el--3">CSS</div>
    <div class="el el--4">are</div>
    <div class="el el--5">amazing</div>
    <div class="el el--6">languages</div>
    <div class="el el--7">to</div>
    <div class="el el--8">learn</div>
  </div>
</body>

</html>
